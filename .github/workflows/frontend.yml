# Quinzex Official
name: Build and Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  # ==========================================
  # 1. BUILD JOB - Compile and package frontend
  # ==========================================
  build:
    runs-on: ubuntu-latest

    environment: production

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository contents
        run: ls -la

      - name: Clean previous dependencies and cache
        run: |
          rm -rf node_modules
          rm -rf ~/.npm
          rm -rf ~/.cache

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Node and npm versions
        run: |
          node -v
          npm -v

      # ==========================================
      # Create .env from GitHub Environment Secret
      # ==========================================
      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          echo "::add-mask::$ENV_FILE"
          printf '%s\n' "$ENV_FILE" > .env

          echo ".env file created successfully"

      - name: Verify .env file
        run: |
          test -f .env
          echo ".env file exists"

      - name: Install dependencies
        run: npm ci

      - name: Verify npm cache integrity
        run: npm cache verify

      - name: Build and export static site
        run: |
          npm run build

      - name: Verify build output directory
        run: |
          ls -la dist || (
            echo "Build output directory missing"
            exit 1
          )

      - name: Create deployment archive
        run: |
          tar -czf frontend.tar.gz -C dist .

      - name: Verify archive file
        run: |
          ls -lh frontend.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend.tar.gz


  # ==========================================
  # 2. RELEASE JOB - Publish build artifact
  # ==========================================
  release:
    runs-on: ubuntu-latest
    needs: build

    environment: production

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Verify downloaded artifact
        run: |
          ls -lh

      - name: Set release tag
        run: |
          echo "RELEASE_TAG=Quinzex_Official-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Confirm release tag
        run: |
          echo "$RELEASE_TAG"

      - name: Create GitHub release with artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: The_QuinzeX_By_QI ${{ github.sha }}
          files: frontend.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================
  # 3. DEPLOY JOB - Deploy to EC2 using SSM
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: release

    environment: production

    steps:

      # ==========================================
      # Configure AWS credentials
      # ==========================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ==========================================
      # Verify AWS identity
      # ==========================================
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ==========================================
      # Deploy to EC2 using AWS SSM
      # ==========================================
      - name: Send deployment command via SSM
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          RELEASE_TAG: Quinzex_Official-${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          set -e

          # ==========================================
          # Validate required configuration
          # ==========================================
          if [ -z "${EC2_TARGET_DIR}" ]; then
            echo "ERROR: EC2_TARGET_DIR is empty."
            echo "Add EC2_TARGET_DIR under:"
            echo "GitHub → Settings → Environments → production → Variables"
            exit 1
          fi

          if [ -z "${EC2_INSTANCE_ID}" ]; then
            echo "ERROR: EC2_INSTANCE_ID is empty."
            exit 1
          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/frontend.tar.gz"

          echo "=========================================="
          echo "Starting deployment"
          echo "=========================================="
          echo "Release: ${RELEASE_TAG}"
          echo "Target directory: ${EC2_TARGET_DIR}"
          echo "AWS Region: ${AWS_REGION}"
          echo "=========================================="

          # ==========================================
          # Build SSM parameters as valid JSON
          # ==========================================
          jq -n \
            --arg release_url "$RELEASE_URL" \
            --arg target_dir "$EC2_TARGET_DIR" \
            '{
              commands: [
                "set -e",
                "echo \"Cleaning temporary deployment directory\"",
                "rm -rf /tmp/frontend",
                "echo \"Creating temporary deployment directory\"",
                "mkdir -p /tmp/frontend",
                "echo \"Downloading frontend release\"",
                ("curl -fL " + ($release_url | @sh) + " -o /tmp/frontend/frontend.tar.gz"),
                "echo \"Creating target directory\"",
                ("mkdir -p " + ($target_dir | @sh)),
                "echo \"Removing previous frontend build\"",
                ("rm -rf " + ($target_dir | @sh) + "/*"),
                "echo \"Extracting new frontend build\"",
                ("tar -xzf /tmp/frontend/frontend.tar.gz -C " + ($target_dir | @sh)),
                "echo \"Deployment completed\"",
                "echo \"Contents of target directory:\"",
                ("ls -la " + ($target_dir | @sh))
              ]
            }' > /tmp/ssm-parameters.json

          echo "SSM parameters prepared successfully"

          # ==========================================
          # Send deployment command
          # ==========================================
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy static Next.js frontend" \
            --parameters file:///tmp/ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: ${COMMAND_ID}"

          # ==========================================
          # Wait for deployment
          # ==========================================
          echo "Waiting for deployment command to complete..."

          set +e

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"

          WAITER_EXIT_CODE=$?

          set -e

          # ==========================================
          # Get SSM output
          # ==========================================
          echo ""
          echo "=========================================="
          echo "SSM STANDARD OUTPUT"
          echo "=========================================="

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text

          echo ""
          echo "=========================================="
          echo "SSM ERROR OUTPUT"
          echo "=========================================="

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "StandardErrorContent" \
            --output text

          echo ""
          echo "=========================================="
          echo "SSM STATUS"
          echo "=========================================="

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode}" \
            --output table

          # ==========================================
          # Fail GitHub Actions if SSM failed
          # ==========================================
          if [ "${WAITER_EXIT_CODE}" -ne 0 ]; then
            echo ""
            echo "Deployment failed."
            exit "${WAITER_EXIT_CODE}"
          fi

          echo ""
          echo "=========================================="
          echo "Deployment completed successfully"
          echo "=========================================="