<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <defs>
    <!-- Vibrant Gradient for Core Constellation -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    
    <!-- Outer Orbit Nodes Gradient with High Visibility -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Drop Glow for Crisp Contrast on Dark and Light Tabs -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f3554" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Inner Core Constellation -->
    <circle cx="22" cy="13" r="3.8" fill="url(#coreGrad)" />
    <circle cx="11" cy="22" r="3.8" fill="url(#coreGrad)" />
    <circle cx="33" cy="22" r="3.8" fill="url(#coreGrad)" />
    <circle cx="15" cy="33" r="3.4" fill="url(#coreGrad)" />
    <circle cx="29" cy="33" r="3.4" fill="url(#coreGrad)" />
    <circle cx="22" cy="24" r="3.0" fill="url(#coreGrad)" />
    
    <!-- Outer Orbit Nodes -->
    <circle cx="6" cy="14" r="2.4" fill="url(#orbitGrad)" opacity="0.9" />
    <circle cx="38" cy="14" r="2.4" fill="url(#orbitGrad)" opacity="0.9" />
    <circle cx="7" cy="30" r="2.4" fill="url(#orbitGrad)" opacity="0.9" />
    <circle cx="37" cy="30" r="2.4" fill="url(#orbitGrad)" opacity="0.9" />
    <circle cx="22" cy="38" r="2.2" fill="url(#orbitGrad)" opacity="0.75" />
    <circle cx="22" cy="5" r="2.2" fill="url(#orbitGrad)" opacity="0.75" />
  </g>
</svg>