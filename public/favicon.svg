<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00f0ff" />
      <stop offset="50%"  stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0a2540" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feFlood flood-color="#00f0ff" flood-opacity="0.45" result="colour" />
      <feComposite in="colour" in2="blur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <circle cx="22" cy="13" r="3.8" fill="url(#coreGrad)" />
    <circle cx="11" cy="22" r="3.8" fill="url(#coreGrad)" />
    <circle cx="33" cy="22" r="3.8" fill="url(#coreGrad)" />
    <circle cx="15" cy="33" r="3.4" fill="url(#coreGrad)" />
    <circle cx="29" cy="33" r="3.4" fill="url(#coreGrad)" />
    <circle cx="22" cy="24" r="3.0" fill="url(#coreGrad)" />
    <circle cx="6"  cy="14" r="2.4" fill="url(#orbitGrad)" opacity="0.92" />
    <circle cx="38" cy="14" r="2.4" fill="url(#orbitGrad)" opacity="0.92" />
    <circle cx="7"  cy="30" r="2.4" fill="url(#orbitGrad)" opacity="0.92" />
    <circle cx="37" cy="30" r="2.4" fill="url(#orbitGrad)" opacity="0.92" />
    <circle cx="22" cy="38" r="2.2" fill="url(#orbitGrad)" opacity="0.80" />
    <circle cx="22" cy="5"  r="2.2" fill="url(#orbitGrad)" opacity="0.80" />
  </g>
</svg>
