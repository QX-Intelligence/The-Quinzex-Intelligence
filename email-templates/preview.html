<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quinzex Email Templates – Montfort Alpine Luxury</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #dce5ec;
      --text-navy: #0f3554;
      --text-navy-secondary: #2d4f6e;
      --text-navy-muted: #56728d;
      --border: rgba(15, 53, 84, 0.16);
      --font-main: 'Montserrat', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-navy);
      font-family: var(--font-main);
      padding: 48px 20px;
      min-height: 100vh;
    }
    .header {
      max-width: 860px;
      margin: 0 auto 36px auto;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-navy);
      border: 1px solid rgba(15, 53, 84, 0.22);
      padding: 6px 18px;
      border-radius: 9999px;
      margin-bottom: 16px;
      background: rgba(15, 53, 84, 0.05);
    }
    h1 {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-navy);
      margin-bottom: 10px;
    }
    p.sub {
      color: var(--text-navy-muted);
      font-family: var(--font-body);
      font-size: 14px;
      max-width: 540px;
      margin: 0 auto 28px auto;
      line-height: 1.6;
    }
    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: rgba(15, 53, 84, 0.06);
      border: 1px solid rgba(15, 53, 84, 0.2);
      color: var(--text-navy);
      padding: 10px 24px;
      border-radius: 9999px;
      font-family: var(--font-main);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background: rgba(15, 53, 84, 0.12);
      border-color: rgba(15, 53, 84, 0.4);
    }
    .tab-btn.active {
      background: var(--text-navy);
      border-color: var(--text-navy);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(15, 53, 84, 0.2);
    }
    .preview-container {
      max-width: 660px;
      margin: 0 auto;
      background: transparent;
      border-radius: 20px;
    }
    iframe {
      width: 100%;
      height: 840px;
      border: none;
      background: transparent;
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="badge">&bull; QUINZEX INTELLIGENCE &bull; DESIGN SYSTEM</div>
    <h1>Themed Email Templates</h1>
    <p class="sub">
      Alpine Montfort aesthetic crafted with crisp typography, signature deep navy (#0f3554), and Swiss minimalist structure.
    </p>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTemplate('executive-inquiry-template.html', this)">
        01. Incoming Inquiry (Admin)
      </button>
      <button class="tab-btn" onclick="showTemplate('client-confirmation-template.html', this)">
        02. Client Confirmation (Auto-Reply)
      </button>
    </div>
  </div>

  <div class="preview-container">
    <iframe id="preview-frame" src="executive-inquiry-template.html"></iframe>
  </div>

  <script>
    function showTemplate(url, btn) {
      document.getElementById('preview-frame').src = url;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>

</body>
</html>
